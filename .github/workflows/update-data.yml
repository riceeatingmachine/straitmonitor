name: Update data

on:
  schedule:
    # Twice a day, 03:17 and 15:17 UTC (PortWatch publishes roughly once a day).
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:
  push:
    paths:
      - make-social-cards.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch PortWatch and news
        run: node scripts/build-data.mjs

      # The cards bake today's numbers into the image, so redraw them after every refresh and bump the
      # ?v= on the og:image tags so link previews fetch the new picture instead of a cached one.
      - name: Redraw the social cards
        run: |
          python3 make-social-cards.py
          stamp=$(date -u +'%Y%m%d')
          sed -i -E "s/og-image\.png\?v=[^\"]*/og-image.png?v=$stamp/g" index.html

      - name: Commit if anything changed
        run: |
          git config user.name "hormuz-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.js data/snapshot.json og-image.png social index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
