name: Update data

on:
  schedule:
    # Twice a day, 03:17 and 15:17 UTC (PortWatch publishes roughly once a day).
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch PortWatch and news
        run: node scripts/build-data.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "hormuz-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.js data/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
